[package]
name = "filament"
version = "0.1.0"
edition = "2021"
description = "Filament — distributed tracing (OTLP span ingest + trace waterfall) for the Steadholme stack."
license = "MIT OR Apache-2.0"

[lib]
name = "filament"
path = "src/lib.rs"

[[bin]]
name = "filament"
path = "src/main.rs"

[dependencies]
# HTTP framework (shared with the estate): Json/State/Path/Query extractors, typed responses.
axum = "0.8"
odyssey = { path = "../odyssey" }
# Async runtime axum runs on. The Store trait is async: handlers `.await` it directly and
# PgStore drives sqlx natively, so a worker thread is NEVER blocked (no sync-over-async bridge).
# `net`/`io-util`/`time` back the non-blocking raw-TCP audit emitter (worker + POST timeout).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (handlers depend
# only on the trait, exactly like the keystone/watchtower seam).
async-trait = "0.1"
# Deserialize the ingest body + serialize the /api/traces + audit envelopes.
serde = { version = "1", features = ["derive"] }
# The ingest path is deliberately LIBERAL (OTLP/HTTP `{resourceSpans:[...]}` OR a flat span
# array), so it parses into `serde_json::Value` and normalizes by hand.
serde_json = "1"
# Ergonomic error/store enums -> branded HTML / JSON error envelope.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch micros -> UTC components for the trace timeline (std only — no C deps). Same crate the
# rest of the estate pins.
time = { version = "0.3", default-features = false, features = ["std"] }
# Stable hash for the deterministic error-trace audit sampler (std only).
# (std::hash::DefaultHasher — no extra crate.)
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (no openssl). Standard SQL only, so the
# same statements later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
