[package]
name = "sift"
version = "0.1.0"
edition = "2021"
description = "Sift — log aggregation + search with template clustering for the HOLDFAST stack."
license = "MIT OR Apache-2.0"

[lib]
name = "sift"
path = "src/lib.rs"

[[bin]]
name = "sift"
path = "src/main.rs"

[dependencies]
# HTTP framework (shared with keystone/inkwell/cellar): Query/State extractors, typed responses.
axum = "0.8"
odyssey = { path = "../odyssey" }
# Async runtime. We run the HTTP server AND the syslog UDP/TCP listeners concurrently on one
# runtime via `tokio::join!`, so we need `net` (UdpSocket/TcpListener), `io-util` (line reads),
# and `time` (per-POST audit timeout). The Store trait is async: handlers `.await` it directly
# and PgStore drives sqlx natively, so a worker thread is NEVER blocked.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (the keystone seam).
async-trait = "0.1"
# Deserialize the search query string + the JSON ingest payloads.
serde = { version = "1", features = ["derive"] }
# Parse the POST /ingest JSON / array / OTLP-ish bodies, and serialize audit events.
serde_json = "1"
# Ergonomic error/store enums -> HTTP shape.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for the log timestamps in the table. std only — no C deps.
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG bytes for the double-submit CSRF token (parity with the estate auth seam).
getrandom = "0.2"
hex = "0.4"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query / QueryBuilder / Row) — NO
# compile-time macros, so the build needs NO database. rustls TLS (no openssl). Standard SQL
# only, so the same statements later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
